; Chess clock for the Waveshare ESP32-S3-Touch-AMOLED-1.8 (V2 revision: CO5300 panel,
; 16 MB flash, 8 MB octal PSRAM). Same toolchain pin as the positions ticker: Arduino-ESP32 3.3.11.
; Everything PlatformIO downloads lives in ./.platformio (see tools/board.sh), so deleting this
; folder removes it all.
[env:amoled18v2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_upload.flash_size = 16MB   ; stamps the image header; without it the bootloader assumes 8 MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
